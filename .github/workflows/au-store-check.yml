# Weekly: check which Australian Stores ship to NZ and what they charge, rewrite their part of data/stores.yaml, and
# commit it to main so the next release ships a fresh list. Pull requests that touch the check run it without writing.
# Decided in "Australian Stores: know which ship to NZ, and leave out the rest by default" (#61).
name: Australian Store check
on:
  schedule:
    - cron: '0 20 * * 0' # Mondays, 08:00 NZST
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/probe-au.ts
      - src/server/auStores.ts
      - .github/workflows/au-store-check.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check (no write on pull requests)
        run: npm run probe-au -- ${{ github.event_name == 'pull_request' && '' || '--write' }}
      - name: Save stores.yaml
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores.yaml
          git diff --cached --quiet || git commit -m "Australian Store check: update stores.yaml" && git push
