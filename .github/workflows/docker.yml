# Docker image for hosted mode: push a tag vX.Y.Z matching package.json's version (the same tag that starts the
# Release workflow) and this builds linux/amd64 + linux/arm64 without QEMU, boots the amd64 image, checks
# /api/status, then pushes ghcr.io/ryski112/magicfinder as X.Y.Z, X.Y and latest.
# Run it by hand (Actions → Docker image → Run workflow) to build and boot-check without pushing; pull requests that
# touch the image or start-up code do the same. release.yml is separate and unchanged.
# Decided in "Which image setup, and how does the owner run and update it on the DS423?".
name: Docker image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - scripts/package.ts
      - src/server/main.ts
      - src/server/hosting.ts
      - src/server/paths.ts
      - src/optimiser/pool.ts
      - package.json
      - package-lock.json
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json ($want)"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - name: Build the amd64 image for the boot check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: magicfinder:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image boots and serves /api/status
        run: |
          docker run -d --name mf -p 5180:5180 magicfinder:check
          ok=
          for i in $(seq 60); do
            sleep 1
            if curl -fsS http://127.0.0.1:5180/api/status | grep -q '"app":"MagicFinder"'; then ok=1; break; fi
          done
          docker logs mf
          docker rm -f mf
          [ -n "$ok" ] || { echo 'The image did not serve /api/status'; exit 1; }
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build both architectures (and push on a tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
