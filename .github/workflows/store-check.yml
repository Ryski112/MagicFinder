# Monthly: fingerprint each Store's shipping policy and location, open an issue when any changed.
name: Store table check
on:
  schedule:
    - cron: '0 20 1 * *' # 1st of each month, 08:00 NZST
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-stores -- --write --issue
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save fingerprints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store-check.json
          git diff --cached --quiet || git commit -m "Store table check: update fingerprints" && git push
