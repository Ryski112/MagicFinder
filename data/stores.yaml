# MagicFinder Store table: one entry per Store (the seller who is paid and ships the parcel).
#
# Hand-maintained. Seeded 2026-10-16/17 from each Store's shipping policy page and Shopify /meta.json
# (see the store-postage and store-cart-prefill research branches). Shopify Stores' postage was then checked against
# what their checkout actually offers (npm run probe-postage), since policy pages can disagree with checkout.
# Fetch TCG sellers are not listed here: MagicFinder builds their entries from the Listings (city, pickup) and uses the default postage.
#
# Fields
#   id            stable slug
#   name          shown in the app
#   source_keys   how Listings from each Source map to this Store (mtgsingles: "NZ/<Key>", fetch: seller id)
#   site          the Store's own website (used for cart links and the monthly change check)
#   location      city, and region: auckland | north_island | south_island (drives region prices and pickup)
#   pickup        available: true | false | null (unknown); fee in NZD
#   postage       list of delivery options. price is either a number or {auckland, north_island, south_island}.
#                 tracked: true | false | null (not stated). rural_surcharge is added for rural addresses.
#                 Leave postage out when the Store doesn't publish rates: the default ($7 tracked, +$5 rural) applies
#                 and the app marks it "est.".
#   free_postage  threshold (number or per-region map), applies_to: all | singles_only
#   cart          shopify | open-listings | hobbymaster-deckbuilder   (how "Add all to cart" works)
#   provenance    where the figures came from, when, and how sure: checkout | published | inferred | default

