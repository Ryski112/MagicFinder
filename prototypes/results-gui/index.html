const BASICS = ['plains', 'island', 'swamp', 'mountain', 'forest', 'wastes'];

// Deterministic Listing generator
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(42);
const round2 = n => Math.round(n * 100) / 100;
const LISTINGS = [];
STORES.forEach(store => CARDS.forEach(card => {
  if (card.notFound) return;
  card.printings.forEach(p => {
    if (rand() < 0.5) {
      LISTINGS.push({
        id: 'L' + LISTINGS.length, cardId: card.id, printingId: p.id, storeId: store.id,
        cond: ['NM', 'NM', 'LP', 'LP', 'LP', 'MP'][Math.floor(rand() * 6)],
        qty: 1 + Math.floor(rand() * 3),
        price: round2(card.base * p.mult * (0.65 + rand() * 0.9)),
        confirmed: card.id === 'tower' ? rand() > 0.4 : true,
      });
    }
  });
}));
// guarantee Counterspell has 4+ copies of a default Printing somewhere
LISTINGS.push({ id: 'Lx1', cardId: 'counter', printingId: 'mh2-267', storeId: 'mm', cond: 'NM', qty: 4, price: 1.95, confirmed: true });
LISTINGS.push({ id: 'Lx2', cardId: 'tutor', printingId: 'cmm-148', storeId: 'kk', cond: 'NM', qty: 1, price: 46.5, confirmed: true });

const DEFAULT_LIST = `1x Sol Ring (c21) 263 [Ramp]
1x Arcane Signet (cmm) 371 [Ramp]
1x Cyclonic Rift (rtr) 35 [Interaction]
1x Rhystic Study (jmp) 168 [Draw]
1x Smothering Tithe (rna) 22 [Ramp]
1x Swords to Plowshares (sta) 10 [Removal]
4x Counterspell (mh2) 267 [Interaction]
1x Lightning Greaves [Protection]
1x Command Tower
1x Fellwar Stone
1x Esper Sentinel (mh2) 12 *F*
1x Fierce Guardianship
1x Demonic Tutor
1x Grim Monolith (ulg) 126
1x Jace's Erasur
12x Island (dmu) 263
10x Plains`;

const COND_RANK = { NM: 0, LP: 1, MP: 2, HP: 3 };
const DEFAULT_SETTINGS = { postageType: 'tracked', pickupCity: 'Auckland', minCond: 'LP', allowFoils: true, useListPrintings: false, fetchOn: true, mtgsOn: true };
const MTGS_BLOCK_AFTER = 6; // demo: MtgSingles stops answering after this many cards

/* ============================================================
   PARSING  (stand-in for the real forgiving paste parser)
   ============================================================ */
function parseList(text) {
  const lines = {}; const unrecognised = []; const basics = []; const order = [];
  text.split('\n').forEach(raw => {
    const s = raw.trim(); if (!s || s.startsWith('//')) return;
    const m = s.match(/^(\d+)\s*x?\s+(.+?)(?:\s+\(([A-Za-z0-9]+)\)\s*([\w-]+)?)?(\s*\*[FE]\*)?(?:\s*\[.*\])?\s*$/);
    if (!m) { unrecognised.push(s); return; }
    const qty = +m[1]; const name = m[2].trim();
    if (BASICS.includes(name.toLowerCase())) { basics.push(`${qty} ${name}`); return; }
    const card = cardByName[name.toLowerCase()];
    if (!card) { unrecognised.push(s); return; }
    let hint = null;
    if (m[3]) {
      const finish = m[5] ? (m[5].includes('E') ? 'etched' : 'foil') : 'nonfoil';
      const p = card.printings.find(p => p.set.toLowerCase() === m[3].toLowerCase() && (!m[4] || p.num === m[4]) && p.finish === finish)
             || card.printings.find(p => p.set.toLowerCase() === m[3].toLowerCase());
      hint = { text: `${m[3].toUpperCase()}${m[4] ? ' #' + m[4] : ''}${m[5] ? ' foil' : ''}`, printingId: p ? p.id : null };
    }
    if (lines[card.id]) lines[card.id].qty += qty;
    else { lines[card.id] = { cardId: card.id, qty, hint }; order.push(card.id); }
  });
  return { lines: order.map(id => lines[id]), unrecognised, basics };
}

/* ============================================================
   OPTIMISER  (brute force over Store subsets; stand-in for HiGHS)
   ============================================================ */
function eligible(line, lock, ctx) {
  return LISTINGS.filter(l => {
    if (l.cardId !== line.cardId) return false;
    if (!ctx.storeOk(l, line)) return false;
    if (COND_RANK[l.cond] > COND_RANK[ctx.settings.minCond]) return false;
    const p = printingById[l.printingId];
    if (lock) return l.printingId === lock && l.confirmed;
    if (p.nonTourn) return false;
    if (!ctx.settings.allowFoils && p.finish !== 'nonfoil') return false;
    return true;
  }).sort((a, b) => a.price - b.price);
}

function postageFor(store, subtotal, ctx) {
  if (ctx.pickup[store.id] && store.city === ctx.settings.pickupCity) return 0;
  if (store.freeOver && subtotal >= store.freeOver) return 0;
  return ctx.settings.postageType === 'tracked' ? store.tracked : store.standard;
}

function planFor(storeSet, lines, ctx) {
  const assignments = [];
  for (const line of lines) {
    let need = line.qty;
    for (const l of line.pool) {
      if (!storeSet.has(l.storeId)) continue;
      const take = Math.min(need, l.qty);
      assignments.push({ cardId: line.cardId, listing: l, qty: take });
      need -= take; if (!need) break;
    }
    if (need) return null;
  }
  const byStore = {};
  assignments.forEach(a => { (byStore[a.listing.storeId] ||= []).push(a); });
  const parcels = Object.entries(byStore).map(([sid, items]) => {
    const store = storeById[sid];
    const subtotal = round2(items.reduce((s, a) => s + a.qty * a.listing.price, 0));
    const postage = postageFor(store, subtotal, ctx);
    return { store, items, subtotal, postage, total: round2(subtotal + postage) };
  }).sort((a, b) => b.total - a.total);
  return { parcels, k: parcels.length, total: round2(parcels.reduce((s, p) => s + p.total, 0)) };
}

function optimise(parsed, excluded, locks, ctx) {
  const active = parsed.lines.filter(l => !excluded[l.cardId]);
  const withPools = active.map(l => ({ ...l, lock: locks[l.cardId] || null, pool: eligible(l, locks[l.cardId], ctx) }));
  const notFound = withPools.filter(l => l.pool.reduce((s, x) => s + x.qty, 0) < l.qty);
  const obtainable = withPools.filter(l => !notFound.includes(l));
  const storeIds = [...new Set(obtainable.flatMap(l => l.pool.map(x => x.storeId)))];
  const best = {};
  for (let mask = 1; mask < (1 << storeIds.length); mask++) {
    const set = new Set(storeIds.filter((_, i) => mask & (1 << i)));
    const plan = planFor(set, obtainable, ctx);
    if (!plan) continue;
    if (!best[plan.k] || plan.total < best[plan.k].total) best[plan.k] = plan;
  }
  const ks = Object.keys(best).map(Number).sort((a, b) => a - b);
  const rungs = []; let kmin = ks[0];
  let cheapest = Infinity; ks.forEach(k => { cheapest = Math.min(cheapest, best[k].total); });
  for (const k of ks) {
    const prev = rungs[rungs.length - 1];
    if (prev && best[k].total >= prev.total) continue;
    rungs.push({ k, ...best[k], saves: prev ? round2(prev.total - best[k].total) : null });
    if (best[k].total === cheapest) break;
  }
  if (rungs.length) rungs[rungs.length - 1].cheapestOverall = true;
  // pickup hints
  rungs.forEach(r => {
    r.pickupHints = r.parcels.filter(p => p.store.city === ctx.settings.pickupCity && !ctx.pickup[p.store.id] && p.postage > 0)
      .map(p => ({ store: p.store, saves: p.postage }));
  });
  return { rungs, kmin, notFound, obtainable, lines: withPools };
}

// Cheapest price per Printing of a line (ignoring the line's own lock), for the alternatives list
function printingOptions(line, ctx) {
  const card = cardById[line.cardId];
  return card.printings.map(p => {
    const ls = LISTINGS.filter(l => l.printingId === p.id && ctx.storeOk(l, line) && COND_RANK[l.cond] <= COND_RANK[ctx.settings.minCond]);
    const cheapest = ls.length ? Math.min(...ls.map(l => l.price)) : null;
    return { printing: p, cheapest, count: ls.length, stores: new Set(ls.map(l => l.storeId)).size };
  });
}

/* ============================================================
   APP STATE HOOK  (shared by every variant)
   ============================================================ */
function useMagicFinder(demo) {
  const [text, setText] = useState(DEFAULT_LIST);
  const [deckName, setDeckName] = useState(null);
  const [excluded, setExcluded] = useState({});
  const [manualLocks, setManualLocks] = useState({});
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [pickup, setPickup] = useState({});
  const [phase, setPhase] = useState('input'); // input | searching | results
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [rungStatus, setRungStatus] = useState({});
  const [selectedK, setSelectedK] = useState(null);
  const timers = useRef([]);

  const parsed = useMemo(() => parseList(text), [text]);
  const locks = useMemo(() => {
    const l = {};
    if (settings.useListPrintings) parsed.lines.forEach(x => { if (x.hint?.printingId) l[x.cardId] = x.hint.printingId; });
    Object.entries(manualLocks).forEach(([k, v]) => { if (v) l[k] = v; else delete l[k]; });
    return l;
  }, [parsed, manualLocks, settings.useListPrintings]);

  const lineIndex = useMemo(() => Object.fromEntries(parsed.lines.map((l, i) => [l.cardId, i])), [parsed]);
  const ctx = useMemo(() => ({
    settings, pickup,
    storeOk: (l, line) => {
      const s = storeById[l.storeId];
      if (s.source === 'Fetch TCG' && !settings.fetchOn) return false;
      if (s.source === 'MtgSingles') {
        if (!settings.mtgsOn) return false;
        if (demo.blocked && line && lineIndex[line.cardId] >= MTGS_BLOCK_AFTER) return false;
      }
      return true;
    },
  }), [settings, pickup, demo.blocked, lineIndex]);

  const result = useMemo(() => phase === 'input' ? null : optimise(parsed, excluded, locks, ctx), [phase, parsed, excluded, locks, ctx]);

  const clear = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  const refine = useCallback((res) => {
    clear();
    const ks = res.rungs.map(r => r.k);
    setRungStatus(Object.fromEntries(ks.map(k => [k, 'refining'])));
    [...ks].reverse().forEach((k, i) => {
      timers.current.push(setTimeout(() => setRungStatus(s => ({ ...s, [k]: (demo.timeout && i === 1) ? 'timedout' : 'exact' })), 700 + i * 650));
    });
  }, [demo.timeout]);

  const search = () => {
    clear(); setPhase('searching');
    const total = parsed.lines.filter(l => !excluded[l.cardId]).length;
    setProgress({ done: 0, total });
    for (let i = 1; i <= total; i++) timers.current.push(setTimeout(() => setProgress({ done: i, total }), i * 260));
    timers.current.push(setTimeout(() => { setPhase('results'); setSelectedK(null); }, total * 260 + 300));
  };

  // re-run refinement whenever the inputs to the Ladder change after results are in
  useEffect(() => { if (phase === 'results' && result) refine(result); }, [phase, result, refine]);
  useEffect(() => clear, []);

  const rungs = useMemo(() => (result?.rungs || []).map(r => {
    const status = rungStatus[r.k] || 'refining';
    const draft = round2(r.total * (1.03 + 0.025 * (r.k % 3)));
    return { ...r, status, shownTotal: status === 'refining' ? draft : r.total, bound: status === 'timedout' ? round2(r.total * 0.012 + 1.4) : null };
  }), [result, rungStatus]);
  const refining = rungs.some(r => r.status === 'refining');
  const selected = rungs.find(r => r.k === selectedK) || rungs[rungs.length - 1] || null;

  return {
    text, setText, deckName, parsed, excluded, locks, settings, pickup, phase, progress, result, rungs, refining, selected, ctx, demo,
    loadArchidekt: (url) => { setText(DEFAULT_LIST); setDeckName(url ? 'Esper Tithes' : null); },
    toggleExcluded: id => setExcluded(e => ({ ...e, [id]: !e[id] })),
    lock: (cardId, printingId) => setManualLocks(l => ({ ...l, [cardId]: printingId })),
    unlock: (cardId) => setManualLocks(l => ({ ...l, [cardId]: null })),
    setSetting: (k, v) => setSettings(s => ({ ...s, [k]: v })),
    togglePickup: id => setPickup(p => ({ ...p, [id]: !p[id] })),
    selectK: setSelectedK, search, backToInput: () => { clear(); setPhase('input'); },
    tryLonger: (k) => setRungStatus(s => ({ ...s, [k]: 'exact' })),
  };
}

/* ============================================================

   ============================================================ */
const $ = n => n == null ? '—' : '$' + n.toFixed(2);
const mockLink = e => { e.preventDefault(); alert('Mock link — in the real app this opens the Listing/Store on its Source.'); };
const cardImg = (p, version = 'normal') => `https://api.scryfall.com/cards/${p.set.toLowerCase()}/${p.num}?format=image&version=${version}`;
const finishLabel = p => p.finish === 'nonfoil' ? '' : p.finish === 'etched' ? 'Etched foil' : 'Foil';
const printingLabel = p => [p.setName, '#' + p.num, p.treatment, finishLabel(p)].filter(Boolean).join(' · ');

function SourceBadge({ source }) {
  const c = source === 'Fetch TCG' ? 'bg-sky-100 text-sky-800' : 'bg-fuchsia-100 text-fuchsia-800';
  return <span className={`text-[10px] font-semibold uppercase tracking-wide px-1.5 py-0.5 rounded ${c}`}>{source}</span>;
}
function Toggle({ on, onChange, label }) {
  return (
    <button type="button" onClick={onChange} className="inline-flex items-center gap-2 text-sm">
      <span className={`w-9 h-5 rounded-full p-0.5 transition ${on ? 'bg-emerald-500' : 'bg-slate-300'}`}>
        <span className={`block w-4 h-4 bg-white rounded-full shadow transition ${on ? 'translate-x-4' : ''}`} />
      </span>{label}
    </button>
  );
}
function PickupToggle({ mf, store }) {
  if (store.city !== mf.settings.pickupCity) return null;
  return <Toggle on={!!mf.pickup[store.id]} onChange={() => mf.togglePickup(store.id)} label="I'll pick up" />;

function LadderChart({ mf }) {
  const rs = mf.rungs; if (!rs.length) return null;
  const W = 520, H = 190, P = 36;
  const max = Math.max(...rs.map(r => r.shownTotal)), min = Math.min(...rs.map(r => r.shownTotal));
  const span = Math.max(max - min, 10);
  const x = i => P + (rs.length === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (rs.length - 1));
  const y = v => P / 2 + (max - v) / span * (H - P * 1.6);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
      <polyline fill="none" stroke="#c7d2fe" strokeWidth="3" points={rs.map((r, i) => `${x(i)},${y(r.shownTotal)}`).join(' ')} />
      {rs.map((r, i) => (
        <g key={r.k} className="cursor-pointer" onClick={() => mf.selectK(r.k)}>
          <circle cx={x(i)} cy={y(r.shownTotal)} r={mf.selected?.k === r.k ? 9 : 6} fill={r.status === 'refining' ? '#fbbf24' : '#4f46e5'} stroke="white" strokeWidth="2" />
          <text x={x(i)} y={y(r.shownTotal) - 14} textAnchor="middle" fontSize="12" fontWeight="600">{$(r.shownTotal)}</text>
          <text x={x(i)} y={H - 6} textAnchor="middle" fontSize="11" fill="#64748b">{r.k} Store{r.k > 1 ? 's' : ''}</text>
        </g>))}
    </svg>
  );
}

          {mf.phase !== 'results' && <div className="h-full grid place-items-center text-slate-400">{mf.phase === 'input' ? 'Edit your Want List on the left, then ▶ Find prices.' : 'Collecting Listings…'}</div>}
          {mf.phase === 'results' && <>
            <section className="bg-white border rounded-lg p-3">
              <div className="flex items-baseline justify-between"><b>Trade-off Ladder</b><span className="text-xs text-slate-500">Landed Cost by number of Stores — click a point</span></div>
              <LadderChart mf={mf} />
              <table className="w-full text-xs tabnum">
                <thead className="text-slate-500"><tr><th className="text-left">Stores</th><th className="text-right">Landed Cost</th><th className="text-right">Saves vs one fewer</th><th className="text-left pl-3">Status</th></tr></thead>
                <tbody>{mf.rungs.map(r => (
                  <tr key={r.k} onClick={() => mf.selectK(r.k)} className={`cursor-pointer ${mf.selected?.k === r.k ? 'bg-indigo-50 font-semibold' : 'hover:bg-slate-50'}`}>
                    <td>{r.k}{r.cheapestOverall && ' (cheapest overall)'}</td><td className="text-right">{$(r.shownTotal)}</td><td className="text-right">{r.saves != null ? $(r.saves) : '—'}</td><td className="pl-3"><StatusBadge r={r} mf={mf} /></td>
                  </tr>))}</tbody>
              </table>
            </section>
            {mf.selected && <section className="bg-white border rounded-lg">
              <div className="flex items-center justify-between px-3 py-2 border-b"><b>Plan: {mf.selected.k} Stores · {$(mf.selected.shownTotal)}</b><PickupHints r={mf.selected} /></div>
              <table className="w-full tabnum">
                <thead className="text-xs text-slate-500 bg-slate-50"><tr><th className="text-left px-3 py-1">Card</th><th className="text-left">Printing</th><th>Cond</th><th className="text-right">Qty</th><th className="text-right">Each</th><th className="text-right px-3">Line</th><th /></tr></thead>
                {mf.selected.parcels.map(p => (
                  <tbody key={p.store.id} className="border-t-2 border-slate-200">
                    <tr className="bg-slate-50"><td colSpan="7" className="px-3 py-1">
                      <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full" style={{ background: p.store.color }} /><a href="#" onClick={mockLink} className="font-semibold hover:underline">{p.store.name} ↗</a><span className="text-xs text-slate-500">{p.store.city}</span><SourceBadge source={p.store.source} /><span className="ml-auto"><PickupToggle mf={mf} store={p.store} /></span></div>
                    </td></tr>
                    {p.items.map(a => (
                      <tr key={a.listing.id} className="border-t border-slate-100 hover:bg-indigo-50/40 cursor-pointer" onClick={() => setInspect(a.cardId)}>
                        <td className="px-3 py-1">{cardById[a.cardId].name} {mf.locks[a.cardId] && '🔒'}</td>
                        <td className="text-xs text-slate-600 max-w-[200px] truncate">{cardLabel(a)} {!a.listing.confirmed && <span className="text-amber-700">(not confirmed)</span>}</td>
                        <td className="text-center text-xs">{a.listing.cond}</td><td className="text-right">{a.qty}</td><td className="text-right">{$(a.listing.price)}</td><td className="text-right px-3">{$(a.qty * a.listing.price)}</td>
                        <td className="pr-2"><a href="#" onClick={mockLink} className="text-indigo-600 text-xs">↗</a></td>
                      </tr>))}
                    <tr className="text-xs text-slate-600"><td colSpan="5" className="text-right px-3">{mf.pickup[p.store.id] && p.store.city === mf.settings.pickupCity ? 'pickup' : `postage (${mf.settings.postageType})${p.store.postageUnknown ? ' est.' : ''}`}{!mf.pickup[p.store.id] && p.store.freeOver && p.subtotal < p.store.freeOver ? ` · free over ${$(p.store.freeOver)}` : ''}</td><td className="text-right px-3">{$(p.postage)}</td><td /></tr>
                    <tr className="font-semibold"><td colSpan="5" className="text-right px-3">Store total</td><td className="text-right px-3">{$(p.total)}</td><td /></tr>
                  </tbody>))}
              </table>
            </section>}
            <section><b className="text-xs text-slate-500 uppercase">Run log</b><div className="mt-1"><Banners mf={mf} compact /></div></section>
          </>}
        </main>

        {/* Right: Inspector */}
        <aside className="border-l bg-white overflow-auto p-3 space-y-3">
          {inspect ? <>
            <div className="flex items-center justify-between"><b>{cardById[inspect].name}</b><button className="text-xs underline" onClick={() => setInspect(null)}>close</button></div>
            <PrintingList mf={mf} cardId={inspect} dense />
            <div className="text-xs text-slate-500">Locking a Printing reruns the Ladder.</div>
          </> : <>
            <b>Stores</b>
            <div className="text-xs text-slate-500">Postage from the Store table. Pickup only for Stores in {mf.settings.pickupCity}.</div>
            <ul className="divide-y">
              {STORES.map(s => {
                const inPlan = mf.selected?.parcels.some(p => p.store.id === s.id);
                return <li key={s.id} className="py-1.5 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full" style={{ background: s.color }} />
                  <div className="flex-1"><div className={inPlan ? 'font-semibold' : ''}>{s.name}</div><div className="text-[11px] text-slate-500">{s.city} · {$(mf.settings.postageType === 'tracked' ? s.tracked : s.standard)}{s.postageUnknown ? ' (est.)' : ''}{s.freeOver ? ` · free over ${$(s.freeOver)}` : ''}</div></div>
                  <PickupToggle mf={mf} store={s} />
                </li>;
              })}
            </ul>
            <div className="text-xs text-slate-400">Click any card to see its Printings.</div>
          </>}
        </aside>
      </div>
    </div>
  );
}
VariantB.label = 'Workbench';

/* ============================================================
   VARIANT C — Visual cart (card images + Store slider)
   ============================================================ */
function CardImage({ printing, className }) {
  const [err, setErr] = useState(false);
  if (err) return <div className={`bg-gradient-to-br from-slate-700 to-slate-900 text-white text-xs p-2 grid place-items-center text-center ${className}`}>{cardById[printing.cardId]?.name}</div>;
  return <img src={cardImg(printing)} loading="lazy" onError={() => setErr(true)} className={`bg-slate-200 ${className}`} alt="" />;
}
function VariantC({ mf }) {
  const [modal, setModal] = useState(null);
  const [gear, setGear] = useState(false);
  const [openParcel, setOpenParcel] = useState(null);
  const res = mf.result;
  const ordered = mf.parsed.lines.filter(l => !mf.excluded[l.cardId]);
  const sel = mf.selected;
  const assignment = {};
  sel?.parcels.forEach(p => p.items.forEach(a => { (assignment[a.cardId] ||= []).push({ ...a, store: p.store }); }));

  if (mf.phase === 'input') return (
    <div className="min-h-screen bg-gradient-to-b from-indigo-950 to-slate-900 text-white grid place-items-center p-6">
      <div className="w-full max-w-2xl space-y-4">
        <h1 className="text-4xl font-black tracking-tight">Cheapest way to buy your list in NZ.</h1>
        <p className="text-indigo-200">Paste a list or an Archidekt link. We'll search Fetch TCG and MtgSingles and show what each extra Store saves you.</p>
        <input className="w-full rounded-lg px-4 py-3 text-slate-900" placeholder="https://archidekt.com/decks/…" onBlur={e => e.target.value && mf.loadArchidekt(e.target.value)} />
        <textarea className="w-full h-56 rounded-lg p-3 font-mono text-xs text-slate-900" value={mf.text} onChange={e => mf.setText(e.target.value)} />
        <div className="flex items-center gap-4">
          <button className="px-6 py-3 rounded-lg bg-amber-400 text-slate-900 font-bold text-lg" onClick={mf.search}>Find my cards</button>
          <span className="text-sm text-indigo-200">{mf.parsed.lines.length} cards recognised{mf.parsed.unrecognised.length ? `, ${mf.parsed.unrecognised.length} not` : ''}{mf.parsed.basics.length ? `, basics skipped` : ''}</span>
          <button className="ml-auto text-sm underline text-indigo-200" onClick={() => setGear(true)}>settings</button>
        </div>
      </div>
      {gear && <SettingsModal mf={mf} close={() => setGear(false)} />}
    </div>
  );

  return (
    <div className="min-h-screen pb-24 bg-slate-100">
      <div className="sticky top-0 z-30 bg-slate-900 text-white shadow-lg">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
          <button className="text-sm text-slate-300" onClick={mf.backToInput}>←</button>
          {mf.phase === 'searching' ? (
            <div className="flex-1"><div className="text-sm text-slate-300 tabnum">Searching {mf.progress.done}/{mf.progress.total}…</div><div className="h-1 bg-slate-700 rounded mt-1"><div className="h-1 bg-amber-400 rounded transition-all" style={{ width: `${100 * mf.progress.done / mf.progress.total}%` }} /></div></div>
          ) : <>
            <div>
              <div className="text-[11px] uppercase tracking-wider text-slate-400">Stores to order from</div>
              <div className="flex mt-1 rounded-lg bg-slate-800 p-1">
                {mf.rungs.map(r => (
                  <button key={r.k} onClick={() => mf.selectK(r.k)} className={`px-4 py-1.5 rounded-md text-center transition ${sel?.k === r.k ? 'bg-amber-400 text-slate-900' : 'hover:bg-slate-700'}`}>
                    <div className="font-bold">{r.k}</div><div className={`text-[11px] tabnum ${r.status === 'refining' ? 'animate-pulse' : ''}`}>{$(r.shownTotal)}</div>
                  </button>))}
              </div>
            </div>
            <div className="ml-auto text-right">
              <div className="text-3xl font-black tabnum">{$(sel?.shownTotal)}</div>
              <div className="text-xs text-slate-300">{sel?.cheapestOverall ? 'Cheapest overall' : `${$(mf.rungs[mf.rungs.length - 1]?.shownTotal)} with ${mf.rungs[mf.rungs.length - 1]?.k} Stores`}{sel?.saves != null ? ` · saves ${$(sel.saves)} vs ${sel.k - 1}` : ''}</div>
              {sel && <div className="mt-0.5"><StatusBadge r={sel} mf={mf} /></div>}
            </div>
            <button onClick={() => setGear(true)} className="text-xl">⚙</button>
          </>}
        </div>
      </div>

      <main className="max-w-6xl mx-auto px-4 py-5 space-y-6">
        {mf.phase === 'results' && <Banners mf={mf} />}
        <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3">
          {ordered.map((l, i) => {
            const card = cardById[l.cardId];
            const searched = mf.phase === 'results' || i < mf.progress.done;
            const nf = res?.notFound.some(n => n.cardId === l.cardId);
            const as = assignment[l.cardId] || [];
            const shown = as[0] ? printingById[as[0].listing.printingId] : printingById[(mf.locks[l.cardId] || card.printings[0].id)];
            return (
              <button key={l.cardId} onClick={() => searched && mf.phase === 'results' && setModal(l.cardId)} className={`text-left bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition ${!searched ? 'opacity-40' : ''}`}>
                <div className="relative">
                  <CardImage printing={shown} className={`w-full aspect-[5/7] object-cover ${nf ? 'grayscale opacity-50' : ''}`} />
                  {l.qty > 1 && <span className="absolute top-2 left-2 bg-black/70 text-white text-xs font-bold rounded px-1.5">×{l.qty}</span>}
                  {mf.locks[l.cardId] && <span className="absolute top-2 right-2 bg-indigo-600 text-white text-xs rounded px-1">🔒</span>}
                  {nf && <span className="absolute inset-x-0 top-1/2 -translate-y-1/2 text-center bg-rose-600 text-white font-bold text-sm py-1 -rotate-6">NOT FOUND</span>}
                  {!searched && <span className="absolute inset-0 grid place-items-center text-2xl animate-pulse">…</span>}
                </div>
                <div className="p-2">
                  <div className="text-xs font-semibold truncate">{card.name}</div>
                  {as.map(a => (
                    <div key={a.listing.id} className="flex items-center gap-1 text-[11px] mt-0.5">
                      <span className="w-2 h-2 rounded-full shrink-0" style={{ background: a.store.color }} />
                      <span className="truncate flex-1">{a.store.name}</span>
                      <span className="tabnum">{a.qty > 1 ? `${a.qty}×` : ''}{$(a.listing.price)}</span>
                    </div>))}
                  {as.some(a => !a.listing.confirmed) && <div className="text-[10px] text-amber-700">Printing not confirmed</div>}
                </div>
              </button>);
          })}
        </div>

        {sel && mf.phase === 'results' && (
          <section>
            <div className="flex items-baseline justify-between mb-2"><h2 className="text-lg font-bold">Your parcels</h2><PickupHints r={sel} /></div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {sel.parcels.map(p => (
                <div key={p.store.id} className="bg-white rounded-xl shadow-sm border-t-4 p-3 space-y-2" style={{ borderColor: p.store.color }}>
                  <div className="flex items-start gap-2">
                    <div className="flex-1"><div className="font-bold">{p.store.name}</div><div className="text-xs text-slate-500">{p.store.city} · <SourceBadge source={p.store.source} /></div></div>
                    <a href="#" onClick={mockLink} className="text-xs px-2 py-1 rounded bg-slate-900 text-white">Open Store ↗</a>
                  </div>
                  <PickupToggle mf={mf} store={p.store} />
                  <button className="text-xs text-indigo-600 underline" onClick={() => setOpenParcel(openParcel === p.store.id ? null : p.store.id)}>{p.items.reduce((s, a) => s + a.qty, 0)} cards {openParcel === p.store.id ? '▴' : '▾'}</button>
                  {openParcel === p.store.id && <ul className="text-xs space-y-0.5">{p.items.map(a => <li key={a.listing.id} className="flex gap-1"><span>{a.qty}× {cardById[a.cardId].name}</span><span className="text-slate-400">{a.listing.cond}</span><a href="#" onClick={mockLink} className="ml-auto text-indigo-600">{$(a.listing.price)} ↗</a></li>)}</ul>}
                  <ParcelFooter mf={mf} parcel={p} />
                </div>))}
            </div>
          </section>
        )}
      </main>

      {modal && (
        <div className="fixed inset-0 z-40 bg-black/50 grid place-items-center p-4" onClick={() => setModal(null)}>
          <div className="bg-white rounded-2xl max-w-3xl w-full p-5 max-h-[85vh] overflow-auto" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between mb-3"><h3 className="text-xl font-bold">{cardById[modal].name}</h3><button onClick={() => setModal(null)}>✕</button></div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              {printingOptions(mf.parsed.lines.find(l => l.cardId === modal), mf.ctx).map(o => {
                const locked = mf.locks[modal] === o.printing.id;
                return (
                  <div key={o.printing.id} className={`rounded-xl p-2 ${locked ? 'ring-2 ring-indigo-600 bg-indigo-50' : 'bg-slate-50'}`}>
                    <CardImage printing={{ ...o.printing, cardId: modal }} className="w-full aspect-[5/7] object-cover rounded-lg" />
                    <div className="text-[11px] mt-1 h-8 overflow-hidden">{printingLabel(o.printing)}</div>
                    {o.printing.nonTourn && <div className="text-[10px] text-slate-500">{o.printing.nonTourn}</div>}
                    <div className="text-sm font-semibold tabnum">{o.cheapest == null ? <span className="text-slate-400">none in stock</span> : `from ${$(o.cheapest)}`}</div>
                    {locked ? <button className="w-full mt-1 text-xs py-1 rounded bg-indigo-600 text-white" onClick={() => mf.unlock(modal)}>🔒 Locked — unlock</button>
                      : <button disabled={!o.count} className="w-full mt-1 text-xs py-1 rounded border disabled:opacity-40" onClick={() => mf.lock(modal, o.printing.id)}>Lock this one</button>}
                  </div>);
              })}
            </div>
            {mf.parsed.lines.find(l => l.cardId === modal).hint && <p className="text-xs text-slate-500 mt-3">Your list said {mf.parsed.lines.find(l => l.cardId === modal).hint.text}.</p>}
          </div>
        </div>
      )}
      {gear && <SettingsModal mf={mf} close={() => setGear(false)} />}
      <Footer />
    </div>
  );
}
function SettingsModal({ mf, close }) {
  return <div className="fixed inset-0 z-40 bg-black/50 grid place-items-center text-slate-900" onClick={close}><div className="bg-white rounded-2xl w-96 p-5" onClick={e => e.stopPropagation()}><div className="flex justify-between mb-3"><h3 className="font-bold">Settings</h3><button onClick={close}>✕</button></div><SettingsForm mf={mf} /></div></div>;
}
VariantC.label = 'Visual cart';

/* ============================================================
   PROTOTYPE SWITCHER + STATE PANEL
   ============================================================ */
const VARIANTS = { A: VariantA, B: VariantB, C: VariantC };
const KEYS = Object.keys(VARIANTS);

function App() {
  const initial = new URLSearchParams(location.search).get('variant');
  const [variant, setVariant] = useState(KEYS.includes(initial) ? initial : 'A');
  const [demo, setDemo] = useState({ blocked: false, timeout: false });
  const [showState, setShowState] = useState(false);
  const mf = useMagicFinder(demo);
  const go = useCallback(d => setVariant(v => {
    const n = KEYS[(KEYS.indexOf(v) + d + KEYS.length) % KEYS.length];
    const u = new URL(location.href); u.searchParams.set('variant', n); history.replaceState(null, '', u);
    return n;
  }), []);
  useEffect(() => {
    const h = e => { const t = e.target; if (t.closest && t.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, [go]);
  const V = VARIANTS[variant];
  const stateDump = {
    phase: mf.phase, selectedRung: mf.selected?.k ?? null, locks: mf.locks, pickup: mf.pickup, excluded: mf.excluded, settings: mf.settings, demo,
    ladder: mf.rungs.map(r => ({ k: r.k, total: r.total, shown: r.shownTotal, status: r.status, saves: r.saves })),
    notFound: mf.result?.notFound.map(l => cardById[l.cardId].name) ?? [],
  };
  return <>
    <V mf={mf} />
    {showState && <pre className="fixed right-3 bottom-20 z-50 w-96 max-h-[60vh] overflow-auto bg-black/85 text-emerald-300 text-[11px] p-3 rounded-lg">{JSON.stringify(stateDump, null, 2)}</pre>}
    <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-fuchsia-700 text-white rounded-full shadow-2xl px-3 py-1.5 text-sm ring-4 ring-fuchsia-300/50">
      <button onClick={() => go(-1)} className="px-2 text-lg">←</button>
      <span className="font-semibold min-w-[150px] text-center">{variant} ({V.label})</span>
      <button onClick={() => go(1)} className="px-2 text-lg">→</button>
      <span className="opacity-50">|</span>
      <label className="flex items-center gap-1 text-xs"><input type="checkbox" checked={demo.blocked} onChange={e => setDemo(d => ({ ...d, blocked: e.target.checked }))} />MtgSingles blocked</label>
      <label className="flex items-center gap-1 text-xs"><input type="checkbox" checked={demo.timeout} onChange={e => setDemo(d => ({ ...d, timeout: e.target.checked }))} />rung times out</label>
      <button className="text-xs underline" onClick={() => setShowState(s => !s)}>state</button>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
